<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Raquel Neres — Desenvolvedora Full Stack</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="ctl">
      <button id="th" aria-label="Tema"></button>
      <button id="lg" aria-label="Idioma">A文</button>
    </div>

    <nav>
      <div class="pill" id="menu">
        <a href="#inicio" class="on" data-k="n1"></a>
        <a href="#sobre" data-k="n2"></a>
        <a href="#projetos" data-k="n3"></a>
        <a href="#certificacoes" data-k="n4"></a>
        <a href="#formacao" data-k="n5"></a>
        <a href="#carreira" data-k="n6"></a>
        <a href="#contato" data-k="n7"></a>
      </div>
    </nav>

    <section id="inicio">
      <div>
        <h1>Raquel Neres</h1>
        <p class="lead" data-k="lead"></p>
        <div class="btns">
          <a class="btn p" href="#projetos" data-k="b1"></a>
          <a class="btn" href="#contato" data-k="b2"></a>
        </div>
      </div>
      <img
        class="photo"
        src="images/profile.jpg"
        alt="Retrato em desenho de Raquel Neres sorrindo"
      >
    </section>

    <div class="skills" id="skills">
      <div class="track" id="track"></div>
    </div>

    <section id="sobre">
      <h2 data-k="n2"></h2>
      <div class="about-copy">
        <p class="lead" data-k="a1"></p>
        <p class="lead" data-k="a2"></p>
        <p class="lead" data-k="a3"></p>
      </div>
    </section>

    <section id="projetos">
      <h2 data-k="n3"></h2>
      <div class="car">
        <div class="arrows">
          <button data-r="row" data-d="-1" aria-label="&larr;">←</button>
        </div>
        <div class="row" id="row"></div>
        <div class="arrows">
          <button data-r="row" data-d="1" aria-label="&rarr;">→</button>
        </div>
      </div>
      <div class="cnt" id="c-row"></div>
    </section>

    <section id="certificacoes">
      <h2 data-k="n4"></h2>
      <p class="lead cert-intro" data-k="certp"></p>
      <div class="car">
        <div class="arrows">
          <button data-r="crow" data-d="-1" aria-label="&larr;">←</button>
        </div>
        <div class="row" id="crow"></div>
        <div class="arrows">
          <button data-r="crow" data-d="1" aria-label="&rarr;">→</button>
        </div>
      </div>
      <div class="cnt" id="c-crow"></div>
    </section>

    <section id="formacao">
      <h2 data-k="n5"></h2>
      <div class="tl">
        <div>
          <small>2024 – 2027</small>
          <h3 data-k="f1t"></h3>
          <p data-k="f1d"></p>
        </div>
        <div>
          <small>2023 – 2024</small>
          <h3 data-k="f2t"></h3>
          <p data-k="f2d"></p>
        </div>
      </div>
    </section>

    <section id="carreira">
      <h2 data-k="n6"></h2>
      <div class="tl">
        <div>
          <small data-k="c1s"></small>
          <h3 data-k="c1t"></h3>
          <p data-k="c1d"></p>
        </div>
        <div>
          <small data-k="c2s"></small>
          <h3 data-k="c2t"></h3>
          <p data-k="c2d"></p>
        </div>
      </div>
    </section>

    <section id="contato">
      <h2 data-k="n7"></h2>
      <div class="ctg">
        <div>
          <h3 data-k="ch"></h3>
          <p class="lead" data-k="ct"></p>
        </div>
        <div class="ctl2">
          <div class="cc">
            <span class="ci">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              >
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M3 7l9 6 9-6"/>
              </svg>
            </span>
            <span class="cx">
              <small>E-mail</small>
              <b id="em">raquelnascimentoneress@gmail.com</b>
            </span>
            <button class="cp" id="cpb" data-k="cp"></button>
          </div>

          <a
            class="cc"
            href="https://www.linkedin.com/in/raqueneres/"
            target="_blank"
            rel="noopener"
          >
            <span class="ci">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <path d="M8 11v5M8 8v.01M12 16v-5M12 13c0-3 4-3 4 0v3"/>
              </svg>
            </span>
            <span class="cx">
              <small>LinkedIn</small>
              <b>linkedin.com/in/raqueneres</b>
            </span>
          </a>

          <a
            class="cc"
            href="https://github.com/RaquelNeres"
            target="_blank"
            rel="noopener"
          >
            <span class="ci">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 19c-4 1.5-4-2-6-2.5m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 00-1.3-3.2 4.2 4.2 0 00-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 00-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 00-.1 3.2A4.6 4.6 0 004 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>
              </svg>
            </span>
            <span class="cx">
              <small>GitHub</small>
              <b>github.com/RaquelNeres</b>
            </span>
          </a>
        </div>
      </div>
    </section>

    <footer>© 2026 Raquel Nascimento Neres · Cariacica, ES</footer>
  </body>
</html>
